<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk — SinaArt</title>
<style>
:root{--cream:#fffaf3;--paper:#fffdf9;--brown:#684b3d;--brown2:#8b6754;--pink:#f4dce4;--line:#eadfd5;--muted:#8b7a70;--shadow:0 12px 32px #684b3d12}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.navbar{position:sticky;top:0;z-index:20;background:#fffaf3ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1050px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.rainbow{background:linear-gradient(90deg,#e89a9a,#d9a5cc,#9b9ddd,#7bbfc0,#d8b76e);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:700}.nav-links a:hover{color:#bd8296}
main{max-width:850px;margin:auto;padding:36px 18px 70px}
.topline{font-size:12px;font-weight:800;letter-spacing:2px;text-align:center;color:var(--brown2);margin:4px 0 12px}
h1{text-align:center;font-size:clamp(30px,5vw,44px);margin:0 0 10px;letter-spacing:-1.5px}
.intro{text-align:center;color:var(--muted);line-height:1.7;max-width:550px;margin:0 auto 28px;font-size:15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;background:#fffdf9;padding:9px 14px;font-size:13px;color:var(--brown2)}
.back{font-weight:700;cursor:pointer}.back:hover{background:var(--pink)}
#productList{display:flex;flex-direction:column;gap:24px}
.product-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.product-photo{width:100%;background:#f7f0e9;display:flex;align-items:center;justify-content:center;min-height:180px;max-height:680px;overflow:hidden}
.product-photo img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain}
.product-photo.no-image{min-height:240px;color:#b39b8b;font-size:46px}
.product-info{padding:22px 24px 24px}
.product-info h2{font-size:clamp(21px,3vw,28px);margin:0 0 10px;line-height:1.3}
.description{white-space:pre-line;line-height:1.8;color:#857369;margin:0 0 18px;font-size:15px;overflow-wrap:anywhere}
.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:17px}
.price{font-size:20px;font-weight:800;color:#936878}
.order{display:inline-flex;justify-content:center;align-items:center;padding:12px 19px;border-radius:99px;background:var(--brown);color:white;font-weight:700;font-size:14px;transition:.2s}
.order:hover{background:#8a6655;transform:translateY(-1px)}
.state{background:#fffdf9;border:1px dashed #d9c8ba;padding:28px 20px;border-radius:18px;text-align:center;color:var(--muted);line-height:1.7}
footer{text-align:center;border-top:1px solid var(--line);padding:25px 18px 32px;color:var(--muted);font-size:13px}
@media(min-width:700px){.product-card{display:grid;grid-template-columns:minmax(0,1fr)}.product-photo{max-height:none}.product-photo img{max-height:680px}}
@media(max-width:560px){.nav-inner{padding:13px 16px}.logo{font-size:22px}.nav-links{gap:13px;font-size:12px}main{padding:28px 13px 55px}.product-info{padding:18px}.product-photo img{max-height:70vh}.product-bottom{align-items:flex-start;flex-direction:column}.order{width:100%}}
</style>
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="rainbow">SinaArt</span>♡</a>
    <nav class="nav-links" aria-label="Navigasi utama">
      <a href="index.html#home">Home</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#about">About</a>
    </nav>
  </div>
</header>
<main>
  <p class="topline">MADE WITH ♡ AND CREATIVITY</p>
  <h1><span class="rainbow">Our Products</span></h1>
  <p class="intro" id="intro">Temukan karya SinaArt yang sesuai dengan keinginanmu.</p>
  <div class="toolbar">
    <a class="pill back" href="index.html">← Kembali ke layanan</a>
    <span class="pill" id="productCount">Memuat produk...</span>
  </div>
  <section id="productList" aria-live="polite"><div class="state">Memuat produk SinaArt... ♡</div></section>
</main>
<footer>
  <div class="logo"><span class="rainbow">SinaArt</span>♡</div>
  <p>Made with ♡ and creativity.</p>
  <p>© <span id="year"></span> SinaArt. All rights reserved.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
const whatsappNumber="62895322852505";
const params=new URLSearchParams(location.search);
const serviceId=params.get("service_id");
const list=document.getElementById("productList");
const count=document.getElementById("productCount");
document.getElementById("year").textContent=new Date().getFullYear();
function harga(v){if(v===null||v===undefined||v==="")return"Harga menyesuaikan";const n=Number(v);return Number.isFinite(n)?"Rp"+n.toLocaleString("id-ID"):"Harga menyesuaikan"}
function escapeText(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pesan(nama){const text="Halo SinaArt! Saya tertarik memesan produk "+nama+". Apakah masih tersedia?";window.open("https://wa.me/"+whatsappNumber+"?text="+encodeURIComponent(text),"_blank","noopener,noreferrer")}
function buatProduk(p){
 const card=document.createElement("article");card.className="product-card";
 const photo=document.createElement("div");photo.className="product-photo";
 if(p.image_url){
   const img=document.createElement("img");img.src=p.image_url;img.alt=p.name||"Produk SinaArt";img.loading="lazy";img.decoding="async";
   img.addEventListener("error",()=>{photo.replaceChildren();photo.classList.add("no-image");photo.textContent="♡"});
   photo.appendChild(img);
 }else{photo.classList.add("no-image");photo.textContent="♡"}
 const info=document.createElement("div");info.className="product-info";
 const title=document.createElement("h2");title.textContent=p.name||"Produk SinaArt";
 const desc=document.createElement("p");desc.className="description";desc.textContent=p.description||"Karya dibuat dengan penuh kreativitas.";
 const bottom=document.createElement("div");bottom.className="product-bottom";
 const price=document.createElement("span");price.className="price";price.textContent=harga(p.price);
 const btn=document.createElement("button");btn.className="order";btn.type="button";btn.textContent="Pesan via WhatsApp ↗";btn.addEventListener("click",()=>pesan(p.name||"produk SinaArt"));
 bottom.append(price,btn);info.append(title,desc,bottom);card.append(photo,info);return card;
}
async function load(){
 try{
  if(!window.supabaseClient){throw new Error("Konfigurasi Supabase belum termuat. Periksa file supabase.js.")}
  let query=supabaseClient.from("products").select("id,service_id,name,description,price,image_url,is_active,created_at").eq("is_active",true).order("created_at",{ascending:false});
  if(serviceId)query=query.eq("service_id",serviceId);
  const {data,error}=await query;if(error)throw error;
  let rows=data||[];
  if(serviceId){
    const {data:svc,error:svcError}=await supabaseClient.from("services").select("id,name").eq("id",serviceId).maybeSingle();
    if(!svcError&&svc){document.title=svc.name+" — SinaArt";document.getElementById("intro").textContent="Lihat pilihan produk untuk layanan "+svc.name+" dan pilih karya yang paling kamu suka. ♡";}
  }
  count.textContent=rows.length+" produk";
  list.replaceChildren();
  if(!rows.length){list.innerHTML='<div class="state">Belum ada produk aktif di layanan ini. Coba kembali lagi nanti ya. ♡</div>';return}
  rows.forEach(p=>list.appendChild(buatProduk(p)));
 }catch(e){console.error(e);count.textContent="Belum termuat";list.innerHTML='<div class="state">Produk belum dapat dimuat. Periksa koneksi dan pengaturan akses tabel products di Supabase.<br><small>'+escapeText(e.message)+'</small></div>'}
}
load();
</script>
</body>
</html>

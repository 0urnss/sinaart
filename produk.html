
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - SinaArt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --cokelat: #4b3028;
    --cokelat-muda: #704936;
    --cream: #fff7e9;
    --pink: #f5b7c8;
    --pink-tua: #c95f7b;
    --garis: #e8c9b5;
    --abu: #826b60;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 110px;
}

body {
    font-family: "Nunito", sans-serif;
    color: var(--cokelat);
    background:
        radial-gradient(circle at 10% 10%, #80523c 0, transparent 350px),
        var(--cokelat);
    line-height: 1.6;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: auto;
}

.rainbow-text {
    display: inline-block;
    background: linear-gradient(
        90deg,
        #ed7186,
        #f6ad55,
        #f6d66b,
        #8fbd8a,
        #7db6dc,
        #a997d5,
        #ed7186
    );
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: rainbow 7s linear infinite;
}

@keyframes rainbow {
    to {
        background-position: 200% center;
    }
}

/* NAVBAR */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding-top: 15px;
}

.navbar {
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 22px;
    background: var(--cream);
    border: 2px dashed var(--garis);
    border-radius: 35px;
    box-shadow: 0 7px 0 #321e1a35;
}

.logo {
    font-family: "Baloo 2", cursive;
    font-size: 35px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-links a {
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 900;
    transition: 0.2s;
}

.nav-links a:hover,
.nav-links .active {
    background: var(--pink);
}

/* BAGIAN JUDUL */

main {
    padding: 45px 0 60px;
}

.judul {
    text-align: center;
    color: var(--cream);
    margin-bottom: 25px;
}

.label-judul {
    display: inline-block;
    background: #f9dce1;
    color: #a94f63;
    border-radius: 25px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 12px;
}

.judul h1 {
    font-family: "Baloo 2", cursive;
    font-size: clamp(35px, 6vw, 52px);
    line-height: 1.15;
    margin-bottom: 8px;
}

.judul p {
    color: #f2dfd2;
    font-size: 15px;
}

.kembali {
    display: inline-block;
    padding: 10px 17px;
    border: 2px solid var(--garis);
    border-radius: 30px;
    background: var(--cream);
    font-weight: 900;
    margin-bottom: 20px;
    transition: 0.2s;
}

.kembali:hover {
    background: var(--pink);
    transform: translateY(-2px);
}

/* DAFTAR PRODUK */

#productList {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.produk-card {
    position: relative;
    padding: clamp(20px, 4vw, 35px);
    background: var(--cream);
    border: 2px solid #f3d4c0;
    border-radius: 35px;
    box-shadow: 0 8px 0 #321e1a35;
    overflow: hidden;
}

.produk-card::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 2px dashed #edc0b2;
    border-radius: 26px;
    pointer-events: none;
}

.produk-content {
    position: relative;
    z-index: 1;
}

/* NAMA LAYANAN */

.jenis-layanan {
    display: inline-block;
    background: #f9dce1;
    color: #a94f63;
    border: 1px solid #efbdc6;
    border-radius: 25px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 12px;
}

.nama-atas {
    font-family: "Baloo 2", cursive;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.2;
    overflow-wrap: anywhere;
    margin-bottom: 22px;
}

/* FOTO PRODUK */

.foto-produk {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fffdf7;
    border: 2px dashed var(--garis);
    border-radius: 25px;
    overflow: hidden;
    margin-bottom: 22px;
    min-height: 180px;
}

.foto-produk img {
    display: block;

    /* Foto mengikuti ukuran dan rasio aslinya */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 80vh;

    object-fit: contain;
}

.foto-kosong {
    width: 100%;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        135deg,
        #fffdf7,
        #f9e2e6,
        #f6edda
    );
    color: var(--pink-tua);
    font-size: 55px;
}

/* DETAIL PRODUK */

.detail-produk {
    background: #fffdf7;
    border: 2px solid var(--garis);
    border-radius: 28px;
    padding: clamp(18px, 3vw, 28px);
}

.detail-produk h2 {
    font-family: "Baloo 2", cursive;
    font-size: clamp(25px, 4vw, 32px);
    line-height: 1.2;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

.deskripsi {
    color: var(--abu);
    font-size: 15px;
    white-space: pre-line;
    overflow-wrap: anywhere;
    margin-bottom: 20px;
}

.bagian-harga {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    border-top: 2px dashed var(--garis);
    padding-top: 18px;
}

.harga {
    color: var(--pink-tua);
    font-family: "Baloo 2", cursive;
    font-size: 26px;
    font-weight: 800;
}

.btn-pesan {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 19px;
    border: none;
    border-radius: 30px;
    background: var(--cokelat-muda);
    color: white;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    transition: 0.2s;
}

.btn-pesan:hover {
    background: var(--pink-tua);
    transform: translateY(-2px);
}

/* STATUS DAN FOOTER */

.status {
    background: var(--cream);
    border: 2px dashed var(--garis);
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    color: var(--abu);
    overflow-wrap: anywhere;
}

footer {
    padding: 25px 0 35px;
    color: #f5dfd1;
    text-align: center;
    font-size: 13px;
}

.footer-logo {
    font-family: "Baloo 2", cursive;
    font-size: 30px;
    font-weight: 800;
}

/* RESPONSIVE HP */

@media (max-width: 600px) {
    header {
        padding-top: 10px;
    }

    .navbar {
        min-height: 65px;
        padding: 9px 13px;
        gap: 5px;
        border-radius: 30px;
    }

    .logo {
        font-size: 27px;
    }

    .nav-links {
        gap: 2px;
    }

    .nav-links a {
        padding: 8px 9px;
        font-size: 12px;
    }

    main {
        padding-top: 30px;
    }

    .produk-card {
        padding: 19px 15px;
        border-radius: 27px;
    }

    .produk-card::before {
        inset: 8px;
        border-radius: 20px;
    }

    .foto-produk {
        border-radius: 19px;
        margin-bottom: 17px;
    }

    .foto-produk img {
        max-height: 70vh;
    }

    .detail-produk {
        padding: 18px;
        border-radius: 22px;
    }

    .deskripsi {
        font-size: 14px;
    }

    .bagian-harga {
        align-items: flex-start;
        flex-direction: column;
    }

    .btn-pesan {
        width: 100%;
    }
}

@media (max-width: 370px) {
    .logo {
        font-size: 23px;
    }

    .nav-links a {
        padding: 7px;
        font-size: 11px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<header>
    <nav class="container navbar">
        <a href="index.html#home" class="logo">
            <span class="rainbow-text">SinaArt</span>♡
        </a>

        <div class="nav-links">
            <a href="index.html#home">Home</a>
            <a href="index.html#pemesanan" class="active">Pemesanan</a>
            <a href="index.html#about">About</a>
        </div>
    </nav>
</header>

<main class="container">

    <div class="judul">
        <span class="label-judul">✿ FIND YOUR FAVORITE ✿</span>
        <h1><span class="rainbow-text">Our Products</span></h1>
        <p id="intro">Karya pilihan SinaArt, dibuat dengan penuh cinta. ♡</p>
    </div>

    <a href="index.html#pemesanan" class="kembali">
        ← Kembali ke Layanan
    </a>

    <section id="productList">
        <div class="status">Memuat produk SinaArt... ♡</div>
    </section>

</main>

<footer>
    <div class="container">
        <div class="footer-logo">
            <span class="rainbow-text">SinaArt</span>♡
        </div>
        <p>Made with ♡ and creativity.</p>
        <p>© <span id="year"></span> SinaArt. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const whatsappNumber = "62895322852505";
const params = new URLSearchParams(window.location.search);
const serviceId = params.get("service_id");

const productList = document.getElementById("productList");

document.getElementById("year").textContent =
    new Date().getFullYear();

function formatHarga(value) {
    if (value === null || value === undefined || value === "") {
        return "Harga menyesuaikan";
    }

    const angka = Number(value);

    return Number.isFinite(angka)
        ? "Rp" + angka.toLocaleString("id-ID")
        : "Harga menyesuaikan";
}

function escapeHTML(text) {
    return String(text ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function pesanProduk(nama) {
    const pesan =
        "Halo SinaArt! Saya tertarik memesan produk " +
        nama +
        ". Apakah masih tersedia?";

    window.open(
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(pesan),
        "_blank",
        "noopener,noreferrer"
    );
}

function buatProduk(produk, namaLayanan) {
    const card = document.createElement("article");
    card.className = "produk-card";

    const content = document.createElement("div");
    content.className = "produk-content";

    /* Nama layanan */

    const badge = document.createElement("div");
    badge.className = "jenis-layanan";
    badge.textContent = "✿ " + (namaLayanan || "SinaArt");

    /* Nama produk bagian atas */

    const namaAtas = document.createElement("h2");
    namaAtas.className = "nama-atas";
    namaAtas.innerHTML =
        '<span class="rainbow-text">' +
        escapeHTML(produk.name || "Produk SinaArt") +
        "</span>";

    /* Foto produk */

    const foto = document.createElement("div");
    foto.className = "foto-produk";

    if (produk.image_url) {
        const img = document.createElement("img");

        img.src = produk.image_url;
        img.alt = produk.name || "Foto produk SinaArt";
        img.loading = "lazy";
        img.decoding = "async";

        img.addEventListener("error", function() {
            foto.replaceChildren();
            const kosong = document.createElement("div");
            kosong.className = "foto-kosong";
            kosong.textContent = "♡";
            foto.appendChild(kosong);
        });

        foto.appendChild(img);
    } else {
        const kosong = document.createElement("div");
        kosong.className = "foto-kosong";
        kosong.textContent = "♡";
        foto.appendChild(kosong);
    }

    /* Detail produk */

    const detail = document.createElement("div");
    detail.className = "detail-produk";

    const nama = document.createElement("h2");
    nama.textContent = produk.name || "Produk SinaArt";

    const deskripsi = document.createElement("p");
    deskripsi.className = "deskripsi";
    deskripsi.textContent =
        produk.description || "Dibuat dengan penuh kreativitas. ♡";

    const bagianHarga = document.createElement("div");
    bagianHarga.className = "bagian-harga";

    const harga = document.createElement("div");
    harga.className = "harga";
    harga.textContent = formatHarga(produk.price);

    const tombol = document.createElement("button");
    tombol.className = "btn-pesan";
    tombol.type = "button";
    tombol.textContent = "Pesan via WhatsApp ↗";

    tombol.addEventListener("click", function() {
        pesanProduk(produk.name || "produk SinaArt");
    });

    bagianHarga.append(harga, tombol);
    detail.append(nama, deskripsi, bagianHarga);

    content.append(badge, namaAtas, foto, detail);
    card.appendChild(content);

    return card;
}

async function muatProduk() {
    try {
        if (typeof supabaseClient === "undefined") {
            throw new Error(
                "supabaseClient tidak ditemukan. Periksa file supabase.js."
            );
        }

        let namaLayanan = "";

        if (serviceId) {
            const layanan = await supabaseClient
                .from("services")
                .select("id,name")
                .eq("id", serviceId)
                .maybeSingle();

            if (!layanan.error && layanan.data) {
                namaLayanan = layanan.data.name || "";

                document.title = namaLayanan + " - SinaArt";

                document.getElementById("intro").textContent =
                    "Pilihan produk dari layanan " +
                    namaLayanan +
                    ". Pilih karya yang kamu suka. ♡";
            }
        }

        let query = supabaseClient
            .from("products")
            .select(
                "id,service_id,name,description,price,image_url,is_active,created_at"
            )
            .eq("is_active", true)
            .order("created_at", { ascending: true });

        if (serviceId) {
            query = query.eq("service_id", serviceId);
        }

        const { data, error } = await query;

        if (error) {
            throw error;
        }

        const products = data || [];

        productList.replaceChildren();

        if (products.length === 0) {
            productList.innerHTML =
                '<div class="status">' +
                "Belum ada produk aktif di layanan ini. ♡" +
                "</div>";
            return;
        }

        if (!namaLayanan && products[0].service_id) {
            const layanan = await supabaseClient
                .from("services")
                .select("id,name")
                .eq("id", products[0].service_id)
                .maybeSingle();

            if (!layanan.error && layanan.data) {
                namaLayanan = layanan.data.name || "";
            }
        }

        products.forEach(function(produk) {
            productList.appendChild(
                buatProduk(produk, namaLayanan)
            );
        });

    } catch (error) {
        console.error("Gagal memuat produk:", error);

        productList.innerHTML =
            '<div class="status">' +
            "Produk belum dapat dimuat. Periksa koneksi atau akses Supabase." +
            "<br><small>" +
            escapeHTML(error.message) +
            "</small></div>";
    }
}

muatProduk();
</script>

</body>
</html>
